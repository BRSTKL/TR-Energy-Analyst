<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>TR-Energy Analyst · uygulama turu</title>
<style>
@font-face{font-family:Inter;src:url(fonts/inter-latin-wght-normal.woff2) format('woff2');font-weight:100 900;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Inter;src:url(fonts/inter-latin-ext-wght-normal.woff2) format('woff2');font-weight:100 900;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:Mono;src:url(fonts/jetbrains-mono-latin-wght-normal.woff2) format('woff2');font-weight:100 800;unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2212}
@font-face{font-family:Mono;src:url(fonts/jetbrains-mono-latin-ext-wght-normal.woff2) format('woff2');font-weight:100 800;unicode-range:U+0100-02BA,U+20A0-20C0}
:root{--s50:#F8FAFC;--s100:#F1F5F9;--s200:#E2E8F0;--s300:#CBD5E1;--s400:#94A3B8;--s500:#64748B;--s600:#475569;--s700:#334155;--s800:#1E293B;--s900:#0F172A;--primary:hsl(221.2 83.2% 53.3%)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0B1530}
body{font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased;color:var(--s900)}
#stage{position:absolute;inset:0;overflow:hidden}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.px{position:absolute;image-rendering:pixelated}
#wall{position:absolute;left:-1400px;top:-1000px;width:4720px;height:3080px;background:
  radial-gradient(900px 700px at 1500px 900px,#2747A8 0,transparent 70%),
  radial-gradient(1100px 800px at 3200px 2100px,#1E3A8A 0,transparent 70%),
  linear-gradient(160deg,#0B1530 0%,#132657 55%,#0E1B3F 100%)}
.win{position:absolute;left:120px;top:104px;width:1680px;height:930px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px rgba(15,23,42,.25),0 40px 90px rgba(2,6,23,.55),0 10px 26px rgba(2,6,23,.35)}
.chrome{height:84px;background:#E8EBF0;border-bottom:1px solid var(--s300);position:relative}
.tabs{height:42px;display:flex;align-items:flex-end;padding:0 16px 0 92px;gap:6px}
.dots{position:absolute;left:18px;top:16px;display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:50%;background:#CBD5E1}
.tab{height:34px;background:#fff;border-radius:10px 10px 0 0;padding:0 16px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--s700);min-width:380px}
.tab .fav{width:16px;height:16px;border-radius:4px;background:var(--primary)}
.addr{position:absolute;left:16px;right:16px;top:48px;height:30px;background:#fff;border-radius:15px;display:flex;align-items:center;padding:0 16px;gap:10px;font-family:Mono;font-size:13px;color:var(--s600)}
.addr .lock{width:12px;height:12px;border-radius:3px;border:2px solid var(--s400)}
.page{position:absolute;left:0;top:84px;width:1680px;height:846px;overflow:hidden;background:#F8FAFC}
.page img{position:absolute;left:0;top:0;width:1680px;will-change:transform}
.hl{position:absolute;border-radius:10px;border:3px solid #F59E0B;pointer-events:none}
.load{position:absolute;left:0;top:0;height:3px;background:var(--primary)}
#hud{position:absolute;inset:0;pointer-events:none}
.cap{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);background:rgba(15,23,42,.78);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:13px 32px;color:#fff;font-size:34px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.cap em{font-style:normal;color:#FDBA74;font-weight:700}
.chap{position:absolute;left:44px;top:34px;display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.8);backdrop-filter:blur(14px);border:1px solid rgba(15,23,42,.08);border-radius:999px;padding:9px 22px 9px 9px;font-size:22px;font-weight:600;color:var(--s800);box-shadow:0 6px 20px rgba(0,0,0,.14)}
.chap b{font-family:Mono;font-size:18px;background:var(--s900);color:#fff;border-radius:999px;padding:5px 12px}
.ctr{position:absolute;right:44px;top:34px;display:flex;align-items:center;gap:12px;background:rgba(15,23,42,.74);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 20px 8px 8px;font-size:21px;font-weight:600;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.ctr b{font-family:Mono;font-size:17px;background:#F59E0B;color:#111827;border-radius:999px;padding:5px 11px}
.anon{position:absolute;right:46px;top:92px;font-family:Mono;font-size:14px;color:rgba(255,255,255,.9);background:rgba(15,23,42,.6);border-radius:8px;padding:5px 11px}
.fade{position:absolute;inset:0;background:#0B1530}
.wipe{position:absolute;inset:0;overflow:hidden}.wipe b{position:absolute}
.wlabel{position:absolute;left:0;right:0;top:50%;text-align:center;color:#fff}
.wlabel .no{font-family:Mono;font-size:28px;font-weight:700;color:#BFDBFE}.wlabel .nm{font-size:64px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.endt{position:absolute;left:0;right:0;text-align:center;color:#fff}
.src{position:absolute;left:0;right:0;bottom:34px;text-align:center;font-family:Mono;font-size:17px;line-height:1.5;color:rgba(226,232,240,.8)}
.logo{display:inline-grid;place-items:center;background:var(--primary)}
</style></head>
<body>
<div id="stage">
  <div class="layer" id="world">
    <div id="wall"></div>
    <div class="win" id="win">
      <div class="chrome"><div class="dots"><i></i><i></i><i></i></div>
        <div class="tabs"><div class="tab"><span class="fav"></span><span id="tabt">TR-Energy Analyst</span></div></div>
        <div class="addr"><span class="lock"></span><span id="addr">tr-energy-analyst/</span></div></div>
      <div class="page" id="page"><div class="hl" id="hl"></div><div class="load" id="load"></div></div>
    </div>
  </div>
  <div class="layer" id="spr"></div>
  <div id="hud"></div>
</div>
<script type="module" src="main.js"></script>
</body></html>
